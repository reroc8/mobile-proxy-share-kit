#
#
#

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

proxies:
  - name: "PLACEHOLDER-DELETE-ME"
    type: ss
    server: 127.0.0.1
    port: 8388
    cipher: aes-128-gcm
    password: placeholder

proxy-providers:
  airport:
    type: http
    url: "https://example.com/your-subscription-url"
    path: ./airport.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: Claude
    type: select
    use:
      - airport
    proxies:
      - DIRECT
  - name: AI
    type: select
    use:
      - airport
    proxies:
      - DIRECT
  - name: Google
    type: select
    use:
      - airport
    proxies:
      - DIRECT
  - name: YouTube
    type: select
    use:
      - airport
    proxies:
      - DIRECT
  - name: Telegram
    type: select
    use:
      - airport
    proxies:
      - DIRECT
  - name: Exchange
    type: select
    use:
      - airport
    proxies:
      - DIRECT
  - name: Proxies
    type: select
    use:
      - airport
    proxies:
      - DIRECT

rules:
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - DOMAIN-SUFFIX,deepseek.com,DIRECT
  - DOMAIN-SUFFIX,kimi.ai,DIRECT
  - DOMAIN-SUFFIX,anthropic.com,Claude
  - DOMAIN-SUFFIX,claude.ai,Claude
  - DOMAIN-SUFFIX,openai.com,AI
  - DOMAIN-SUFFIX,chatgpt.com,AI
  - DOMAIN-SUFFIX,gemini.google.com,AI
  - DOMAIN-SUFFIX,google.com,Google
  - DOMAIN-SUFFIX,googleapis.com,Google
  - DOMAIN-SUFFIX,youtube.com,YouTube
  - DOMAIN-SUFFIX,googlevideo.com,YouTube
  - DOMAIN-SUFFIX,telegram.org,Telegram
  - DOMAIN-SUFFIX,okx.com,Exchange
  - DOMAIN-SUFFIX,binance.com,Exchange
  - GEOIP,CN,DIRECT
  - MATCH,Proxies
