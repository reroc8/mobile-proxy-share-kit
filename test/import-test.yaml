# Karing 导入测试 v2
#
# 修正 v1 的报错（clash: proxies/proxy-providers not found or empty）：
# Karing 要求 Clash 配置里必须有节点来源，所以这里加了一个 proxy-providers。
#
# 里面的 url 是占位地址。导入后请在 Karing 里把它换成你自己的订阅地址
# （若 Karing 不允许改，就用对话里说的备选方案）。
#
# 本文件不含任何真实节点、订阅、账号或 token。

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

proxies:
  # 占位节点（导入成功后可在 App 里删掉），目的是满足「proxies 非空」校验
  - name: "PLACEHOLDER-DELETE-ME"
    type: ss
    server: 127.0.0.1
    port: 8388
    cipher: aes-128-gcm
    password: placeholder

proxy-providers:
  airport:
    type: http
    # ↓ 占位地址，导入后在 App 内替换为你的订阅地址
    url: "https://example.com/your-subscription-url"
    path: ./airport.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: Claude
    type: select
    use:
      - airport
    proxies:
      - DIRECT
  - name: AI
    type: select
    use:
      - airport
    proxies:
      - DIRECT
  - name: Google
    type: select
    use:
      - airport
    proxies:
      - DIRECT
  - name: YouTube
    type: select
    use:
      - airport
    proxies:
      - DIRECT
  - name: Telegram
    type: select
    use:
      - airport
    proxies:
      - DIRECT
  - name: Exchange
    type: select
    use:
      - airport
    proxies:
      - DIRECT
  - name: Proxies
    type: select
    use:
      - airport
    proxies:
      - DIRECT

rules:
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - DOMAIN-SUFFIX,deepseek.com,DIRECT
  - DOMAIN-SUFFIX,kimi.ai,DIRECT
  - DOMAIN-SUFFIX,anthropic.com,Claude
  - DOMAIN-SUFFIX,claude.ai,Claude
  - DOMAIN-SUFFIX,openai.com,AI
  - DOMAIN-SUFFIX,chatgpt.com,AI
  - DOMAIN-SUFFIX,gemini.google.com,AI
  - DOMAIN-SUFFIX,google.com,Google
  - DOMAIN-SUFFIX,googleapis.com,Google
  - DOMAIN-SUFFIX,youtube.com,YouTube
  - DOMAIN-SUFFIX,googlevideo.com,YouTube
  - DOMAIN-SUFFIX,telegram.org,Telegram
  - DOMAIN-SUFFIX,okx.com,Exchange
  - DOMAIN-SUFFIX,binance.com,Exchange
  - GEOIP,CN,DIRECT
  - MATCH,Proxies
